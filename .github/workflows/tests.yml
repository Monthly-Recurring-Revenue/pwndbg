name: Tests
on:
  push:
    branches:
      - dev
    paths:
      - "**"
      - "!mkdocs.yml"
      - "!docs/**"
      - "!*.md"
  pull_request:
    paths:
      - "**"
      - "!mkdocs.yml"
      - "!docs/**"
      - "!*.md"

concurrency:
  # PRs: cancel in-progress runs (only test latest)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-using-nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        type: [tests, qemu-system-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # @v3
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # @v31.9.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache jemalloc build
        uses: actions/cache@v5
        with:
          path: |
            /tmp/jemalloc-5.3.0
            /usr/local/bin/jemalloc-config
          key: jemalloc-build-5.3.0-${{ matrix.os }}

      - name: Install dependencies
        run: |
          ./setup-dev.sh --install-only

      - name: install uv
        run: nix profile install --inputs-from . nixpkgs#uv

      - name: Build pwndbg
        run: |
          nix build '.#pwndbg-dev' --accept-flake-config -o result

      # We set `kernel.yama.ptrace_scope=0` for `attachp` command tests
      - name: Setup
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Run tests
        if: matrix.type == 'tests'
        run: |
          LOG_UNIT=$(mktemp)
          LOG_GDB=$(mktemp)
          LOG_DBG=$(mktemp)
          LOG_CROSS=$(mktemp)

          ./unit-tests.sh > "$LOG_UNIT" 2>&1 &
          PID_UNIT=$!
          ./tests.sh --nix -d gdb -g gdb > "$LOG_GDB" 2>&1 &
          PID_GDB=$!
          ./tests.sh --nix -d gdb -g dbg > "$LOG_DBG" 2>&1 &
          PID_DBG=$!
          ./tests.sh --nix -d gdb -g cross-arch-user > "$LOG_CROSS" 2>&1 &
          PID_CROSS=$!

          FAILED=0
          for pid in $PID_UNIT $PID_GDB $PID_DBG $PID_CROSS; do
            wait $pid || FAILED=1
          done

          echo "=== Unit Tests ==="
          cat "$LOG_UNIT"
          echo ""
          echo "=== GDB Tests ==="
          cat "$LOG_GDB"
          echo ""
          echo "=== DBG Tests ==="
          cat "$LOG_DBG"
          echo ""
          echo "=== Cross-Arch Tests ==="
          cat "$LOG_CROSS"

          rm -f "$LOG_UNIT" "$LOG_GDB" "$LOG_DBG" "$LOG_CROSS"
          exit $FAILED

      - name: Set up cache for QEMU images
        if: matrix.type == 'qemu-system-tests'
        id: qemu-cache
        uses: actions/cache@v5
        with:
          path: ./tests/library/qemu_system/kimages
          key: ${{ matrix.os }}-cache-qemu-images

      - name: Download QEMU images
        if: matrix.type == 'qemu-system-tests'
        run: |
          # Would happen in the next step as well, but this way
          # it looks nicer in the CI.
          ./tests/library/qemu_system/download-kernel-images.sh

      - name: Run kernel tests
        if: matrix.type == 'qemu-system-tests'
        run: |
          ./kernel-tests.sh --nix

  qemu-system-tests:
    runs-on: [ubuntu-22.04]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Cache for pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ matrix.os }}-cache-pip

      - name: Cache jemalloc build
        uses: actions/cache@v5
        with:
          path: |
            /tmp/jemalloc-5.3.0
            /usr/local/bin/jemalloc-config
          key: jemalloc-build-5.3.0-ubuntu-22.04

      - name: Setup pwndbg
        run: |
          ./setup.sh
          ./setup-dev.sh

      - name: Set up cache for QEMU images
        id: qemu-cache
        uses: actions/cache@v5
        with:
          path: ./tests/library/qemu_system/kimages
          key: ${{ matrix.os }}-cache-qemu-images

      - name: Download images
        run: |
          ./tests/library/qemu_system/download-kernel-images.sh

      # We set `kernel.yama.ptrace_scope=0` for `gdb-pt-dump`
      - name: Run kernel tests
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0
          ./kernel-tests.sh
