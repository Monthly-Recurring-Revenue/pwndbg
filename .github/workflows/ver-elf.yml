name: Compare elfutils/debuginfod-client Versions (Oct13 vs Jan22)

on:
  push:
    branches:
      - fix-tests

permissions:
  contents: read
  packages: read

jobs:
  oct13_elfutils:
    name: "elfutils versions - Oct13 fedora:42 base"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pwndbg/pwndbg
          ref: 1641c8cb3b614be7035d41abe3d60542933e4a3e
      - uses: docker/setup-buildx-action@v3
      - name: Build Oct13 image
        run: |
          docker buildx build --load \
            --cache-from type=registry,ref=ghcr.io/pwndbg/cache:fedora42-amd64 \
            -f Dockerfile.dnf \
            --build-arg image=fedora@sha256:aa7befe5cfd1f0e062728c16453cd1c479d4134c7b85eac00172f3025ab0d522 \
            -t ghcr.io/pwndbg/pwndbg:fedora42 .
      - name: Dump elfutils and debuginfod packages
        run: |
          docker run --rm ghcr.io/pwndbg/pwndbg:fedora42 bash -c '
            echo "=== RPM: elfutils packages ==="
            rpm -qa | grep -i elfutils | sort
            echo ""
            echo "=== RPM: musl packages ==="
            rpm -qa | grep -i musl | sort
            echo ""
            echo "=== debuginfod-find version ==="
            debuginfod-find --version 2>&1 || true
            echo ""
            echo "=== DEBUGINFOD_URLS in environment ==="
            echo "${DEBUGINFOD_URLS:-<not set>}"
            echo ""
            echo "=== /etc/debuginfod/ config ==="
            ls /etc/debuginfod/ 2>/dev/null && cat /etc/debuginfod/*.urls 2>/dev/null || echo "<no config>"
          '

  jan22_elfutils:
    name: "elfutils versions - Jan22 fedora:42 base"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pwndbg/pwndbg
          ref: 1641c8cb3b614be7035d41abe3d60542933e4a3e
      - uses: docker/setup-buildx-action@v3
      - name: Build Jan22 image
        run: |
          docker buildx build --load \
            --cache-from type=registry,ref=ghcr.io/pwndbg/cache:fedora42-amd64 \
            -f Dockerfile.dnf \
            --build-arg image=fedora@sha256:b3d16134560afa00d7cc2a9e4967eb5b954512805f3fe27d8e70bbed078e22ea \
            -t ghcr.io/pwndbg/pwndbg:fedora42 .
      - name: Dump elfutils and debuginfod packages
        run: |
          docker run --rm ghcr.io/pwndbg/pwndbg:fedora42 bash -c '
            echo "=== RPM: elfutils packages ==="
            rpm -qa | grep -i elfutils | sort
            echo ""
            echo "=== RPM: musl packages ==="
            rpm -qa | grep -i musl | sort
            echo ""
            echo "=== debuginfod-find version ==="
            debuginfod-find --version 2>&1 || true
            echo ""
            echo "=== DEBUGINFOD_URLS in environment ==="
            echo "${DEBUGINFOD_URLS:-<not set>}"
            echo ""
            echo "=== /etc/debuginfod/ config ==="
            ls /etc/debuginfod/ 2>/dev/null && cat /etc/debuginfod/*.urls 2>/dev/null || echo "<no config>"
          '
