      - name: Run Mallocng Tests
        run: |
          docker compose run -T --rm --pull never -v $(pwd):/pwndbg fedora42 bash -c '
            set -euo pipefail
            make -C /pwndbg/tests/binaries/host -j4 all
            gdb --batch

            set +e
            ./tests.sh -d gdb -g dbg mallocng > /tmp/dbg-gdb.log 2>&1 & pid=$!
            wait $pid; exit_code=$?
            set -e

            sed "s/^/[DBG-GDB] /" /tmp/dbg-gdb.log
            echo ""
            sed -n "/^\*\*\*/,\$p" /tmp/dbg-gdb.log | sed "s/^/[DBG-GDB] /"
            exit $exit_code
