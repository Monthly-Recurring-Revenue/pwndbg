    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          # disconnect3d's delete breakpoints PR
          ref: 3a1b3f4d94ec3165d93e64c482345a01fc79884e
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Buildx fedora42
        run: |
          docker buildx build \
