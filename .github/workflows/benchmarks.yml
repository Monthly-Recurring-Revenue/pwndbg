name: Benchmarks

on:
  push:
    branches:
      - benchmark
    paths:
      - "**"
      - "!mkdocs.yml"
      - "!docs/**"
      - "!*.md"
  pull_request:
    paths:
      - "**"
      - "!mkdocs.yml"
      - "!docs/**"
      - "!*.md"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline commit SHA to compare against"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

# Default baseline: upstream dev ~3 months ago (Jan 2026).
# Override via workflow_dispatch input or change this value.
env:
  DEFAULT_BASELINE: a346427bc

jobs:
  # ── General benchmarks (startup, context, etc.) ─────────────
  benchmark:
    name: benchmark (general)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Determine baseline commit
        id: baseline
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "label=PR base (${{ github.event.pull_request.base.ref }})" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.baseline }}" ]]; then
            echo "sha=${{ github.event.inputs.baseline }}" >> "$GITHUB_OUTPUT"
            echo "label=custom (${{ github.event.inputs.baseline }})" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ env.DEFAULT_BASELINE }}" >> "$GITHUB_OUTPUT"
            echo "label=baseline (${{ env.DEFAULT_BASELINE }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Pull or build pwndbg image
        run: |
          if docker pull ghcr.io/pwndbg/pwndbg:ubuntu24.04 2>/dev/null; then
            docker tag ghcr.io/pwndbg/pwndbg:ubuntu24.04 pwndbg-bench:latest
          else
            docker buildx build --load \
              --cache-from type=registry,ref=ghcr.io/pwndbg/cache:ubuntu24.04-amd64 \
              -f Dockerfile --build-arg image=ubuntu:24.04 \
              -t pwndbg-bench:latest .
          fi

      - name: Run benchmarks (HEAD)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $(pwd):/pwndbg \
            pwndbg-bench:latest \
            bash -c '
              set -eo pipefail
              cd /pwndbg
              bash profiling/ci_benchmark.sh /tmp/bench_out
              cp /tmp/bench_out/combined.json /pwndbg/head_results.json
            '

      - name: Save HEAD results and checkout baseline
        run: |
          cp head_results.json /tmp/head_results.json
          cp -r profiling /tmp/profiling_scripts
          cp scripts/common.sh /tmp/profiling_scripts/_common.sh
          git checkout ${{ steps.baseline.outputs.sha }}

      - name: Run benchmarks (baseline)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $(pwd):/pwndbg \
            -v /tmp/profiling_scripts:/bench_scripts:ro \
            pwndbg-bench:latest \
            bash -c '
              set -eo pipefail
              cd /pwndbg
              cp /bench_scripts/_common.sh /pwndbg/scripts/common.sh 2>/dev/null || true
              bash /bench_scripts/ci_benchmark.sh /tmp/bench_out
              cp /tmp/bench_out/combined.json /pwndbg/base_results.json
            '

      - name: Restore HEAD
        run: |
          cp /tmp/head_results.json head_results.json
          git checkout ${{ github.sha }}

      - name: Generate comparison report
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "**HEAD**: \`$(git rev-parse --short HEAD)\` | **Baseline**: \`$(git rev-parse --short ${{ steps.baseline.outputs.sha }})\` (${{ steps.baseline.outputs.label }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 profiling/compare_benchmarks.py \
            base_results.json head_results.json \
            --threshold 15 >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-general
          path: |
            head_results.json
            base_results.json
          retention-days: 30

  # ── Heap benchmarks across glibc versions ────────────────────
  heap-benchmark:
    name: benchmark (heap-glibc-${{ matrix.glibc }})
    strategy:
      fail-fast: false
      matrix:
        glibc: ["2.35", "2.38", "2.41", "2.43"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Determine baseline commit
        id: baseline
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "label=PR base (${{ github.event.pull_request.base.ref }})" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.baseline }}" ]]; then
            echo "sha=${{ github.event.inputs.baseline }}" >> "$GITHUB_OUTPUT"
            echo "label=custom (${{ github.event.inputs.baseline }})" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ env.DEFAULT_BASELINE }}" >> "$GITHUB_OUTPUT"
            echo "label=baseline (${{ env.DEFAULT_BASELINE }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache glibc ${{ matrix.glibc }} artifacts
        id: cache-glibc
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: glibcs/${{ matrix.glibc }}
          key: glibc-bench-${{ matrix.glibc }}-${{ hashFiles('scripts/build-one-glibc.sh', 'Dockerfile.glibc-test-libs') }}

      - name: Build glibc ${{ matrix.glibc }}
        if: steps.cache-glibc.outputs.cache-hit != 'true'
        run: |
          docker build \
            -f Dockerfile.glibc-test-libs \
            --target build-${{ matrix.glibc }} \
            -t glibc-builder:${{ matrix.glibc }} .
          CID=$(docker create glibc-builder:${{ matrix.glibc }})
          mkdir -p glibcs/${{ matrix.glibc }}
          docker cp "${CID}:/glibcs/${{ matrix.glibc }}/." glibcs/${{ matrix.glibc }}/
          docker rm "${CID}" > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Pull or build pwndbg image
        run: |
          if docker pull ghcr.io/pwndbg/pwndbg:ubuntu24.04 2>/dev/null; then
            docker tag ghcr.io/pwndbg/pwndbg:ubuntu24.04 pwndbg-bench:latest
          else
            docker buildx build --load \
              --cache-from type=registry,ref=ghcr.io/pwndbg/cache:ubuntu24.04-amd64 \
              -f Dockerfile --build-arg image=ubuntu:24.04 \
              -t pwndbg-bench:latest .
          fi

      - name: Run heap benchmarks (HEAD) glibc ${{ matrix.glibc }}
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $(pwd):/pwndbg \
            pwndbg-bench:latest \
            bash -c '
              set -eo pipefail
              cd /pwndbg
              bash profiling/ci_benchmark.sh /tmp/bench_out \
                --heap-only \
                --glibc-dir /pwndbg/glibcs/${{ matrix.glibc }}
              cp /tmp/bench_out/combined.json /pwndbg/head_heap_results.json
            '

      - name: Save HEAD results and checkout baseline
        run: |
          cp head_heap_results.json /tmp/head_heap_results.json
          cp -r profiling /tmp/profiling_scripts
          git checkout ${{ steps.baseline.outputs.sha }}

      - name: Run heap benchmarks (baseline) glibc ${{ matrix.glibc }}
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $(pwd):/pwndbg \
            -v /tmp/profiling_scripts:/bench_scripts:ro \
            pwndbg-bench:latest \
            bash -c '
              set -eo pipefail
              cd /pwndbg
              cp /bench_scripts/_common.sh /pwndbg/scripts/common.sh 2>/dev/null || true
              bash /bench_scripts/ci_benchmark.sh /tmp/bench_out \
                --heap-only \
                --glibc-dir /pwndbg/glibcs/${{ matrix.glibc }}
              cp /tmp/bench_out/combined.json /pwndbg/base_heap_results.json
            '

      - name: Restore HEAD
        run: |
          cp /tmp/head_heap_results.json head_heap_results.json
          git checkout ${{ github.sha }}

      - name: Generate comparison report
        run: |
          echo "## Heap Benchmark - glibc ${{ matrix.glibc }}" >> $GITHUB_STEP_SUMMARY
          echo "**HEAD**: \`$(git rev-parse --short HEAD)\` | **Baseline**: \`$(git rev-parse --short ${{ steps.baseline.outputs.sha }})\` (${{ steps.baseline.outputs.label }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 profiling/compare_benchmarks.py \
            base_heap_results.json head_heap_results.json \
            --threshold 15 >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-heap-glibc-${{ matrix.glibc }}
          path: |
            head_heap_results.json
            base_heap_results.json
          retention-days: 30
