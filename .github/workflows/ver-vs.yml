name: Prove glibc vs musl Debuginfod Behavior Differs

on:
  push:
    branches:
      - fix-tests

permissions:
  contents: read
  packages: read

jobs:
  # Single-run diagnostic that proves (or disproves) the theory:
  #   - glibc debuginfo is pre-installed / resolves locally -> no async path
  #   - musl debuginfo is NOT pre-installed -> async debuginfod request fires
  # We dump:
  #   1. Local debug-file presence for both libraries
  #   2. debuginfod-find timing for both (local hit = fast, remote = slow)
  #   3. GDB's `set debug debuginfod on` output on a musl vs a glibc binary
  compare_debuginfod_behavior:
    name: "Compare glibc vs musl debuginfod handling"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pwndbg/pwndbg
          ref: 1641c8cb3b614be7035d41abe3d60542933e4a3e
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker buildx build --load \
            --cache-from type=registry,ref=ghcr.io/pwndbg/cache:fedora42-amd64 \
            -f Dockerfile.dnf \
            --build-arg image=fedora@sha256:b3d16134560afa00d7cc2a9e4967eb5b954512805f3fe27d8e70bbed078e22ea \
            -t ghcr.io/pwndbg/pwndbg:fedora42 .
      - name: Inspect local debuginfo presence
        run: |
          docker run --rm ghcr.io/pwndbg/pwndbg:fedora42 bash -c '
            echo "=== Installed *-debuginfo RPMs ==="
            rpm -qa | grep -iE "debuginfo|debugsource" | sort || echo "(none)"

            echo ""
            echo "=== Local debug files for glibc ==="
            find /usr/lib/debug -name "*libc*" 2>/dev/null | head -20 || echo "(none)"
            find /usr/lib/debug -name "*ld-linux*" 2>/dev/null | head -5 || echo "(none)"

            echo ""
            echo "=== Local debug files for musl ==="
            find /usr/lib/debug -name "*musl*" 2>/dev/null | head -20 || echo "(none)"

            echo ""
            echo "=== Paths GDB sees ==="
            GLIBC_SO=$(ldconfig -p 2>/dev/null | grep "libc.so.6" | awk "{print \$NF}" | head -1)
            MUSL_SO=$(ldconfig -p 2>/dev/null | grep "ld-musl" | awk "{print \$NF}" | head -1)
            echo "glibc: $GLIBC_SO"
            echo "musl:  $MUSL_SO"

            echo ""
            echo "=== Build IDs ==="
            echo "glibc: $(eu-readelf -n "$GLIBC_SO" 2>/dev/null | grep -i "build id" || echo "none")"
            echo "musl:  $(eu-readelf -n "$MUSL_SO"  2>/dev/null | grep -i "build id" || echo "none")"
          '
      - name: Time debuginfod-find for glibc vs musl
        run: |
          docker run --rm ghcr.io/pwndbg/pwndbg:fedora42 bash -c '
            GLIBC_SO=$(ldconfig -p 2>/dev/null | grep "libc.so.6" | awk "{print \$NF}" | head -1)
            MUSL_SO=$(ldconfig -p 2>/dev/null | grep "ld-musl" | awk "{print \$NF}" | head -1)

            echo "=== debuginfod-find: glibc (expect fast if local, slow if remote) ==="
            time debuginfod-find debuginfo "$GLIBC_SO" 2>&1 || true
            echo ""
            echo "=== debuginfod-find: musl (expect slow / NOT_DOWNLOADED) ==="
            time debuginfod-find debuginfo "$MUSL_SO"  2>&1 || true
          '
      - name: GDB debuginfod-debug output on musl vs glibc binary
        run: |
          docker compose run -T --rm --pull never -v $(pwd):/pwndbg fedora42 bash -c '
            set -e
            make -C /pwndbg/tests/binaries/host -j4 all

            # Pick a glibc-linked test binary (anything not "musl" in the name)
            GLIBC_BIN=$(find /pwndbg/tests/binaries/host -maxdepth 1 -name "*.native.out" ! -name "*musl*" -type f | head -1)
            MUSL_BIN=/pwndbg/tests/binaries/host/heap_musl_dyn.native.out

            echo "glibc binary: $GLIBC_BIN"
            echo "musl  binary: $MUSL_BIN"
            echo ""

            echo "============================================================"
            echo "GLIBC - GDB debuginfod debug trace (no pwndbg, -nx)"
            echo "============================================================"
            /usr/bin/gdb -nx -batch \
              -ex "set debug debuginfod on" \
              -ex "set debuginfod enabled on" \
              -ex "file $GLIBC_BIN" \
              -ex "start" \
              -ex "finish" \
              -ex "quit" 2>&1 | sed "s/^/[GLIBC] /"

            echo ""
            echo "============================================================"
            echo "MUSL  - GDB debuginfod debug trace (no pwndbg, -nx)"
            echo "============================================================"
            /usr/bin/gdb -nx -batch \
              -ex "set debug debuginfod on" \
              -ex "set debuginfod enabled on" \
              -ex "file $MUSL_BIN" \
              -ex "break break_here" \
              -ex "run" \
              -ex "finish" \
              -ex "quit" 2>&1 | sed "s/^/[MUSL] /"
          '
