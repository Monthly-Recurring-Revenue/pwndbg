name: Heap Libc Version Tests

# Tests pwndbg's libc detection + heap commands against many glibc, musl, and
# bionic (Android) versions. Per-version/per-API libc artifacts live in ghcr
# "scratch" images (one per libc); CI pulls them and only rebuilds an image when
# its image-defining files change, (re)publishing on the publish branch. One
# matrix job covers all three libcs.

on:
  workflow_dispatch:
  push:
    # TODO(upstream): change `libc` -> `dev` before merging to pwndbg/pwndbg.
    branches: [libc]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # Use dorny/paths-filter instead of on.paths so that skipped jobs still report
  # as passed to branch protection, allowing unrelated PRs to merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      glibc_image: ${{ steps.filter.outputs.glibc_image }}
      musl_image: ${{ steps.filter.outputs.musl_image }}
      bionic_image: ${{ steps.filter.outputs.bionic_image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@f3ceefdc7ef57bc2d8560787d4b6c33e44044cec # master (unreleased, for predicate-quantifier)
        id: filter
        with:
          # On push, diff the push delta (base == the pushed branch). Otherwise dorny
          # defaults base to the repo default branch (dev); since `libc` has diverged
          # from dev by the whole feature, every push would look fully changed and
          # rebuild all images. On PRs, leave base empty so dorny diffs the PR base.
          # TODO(upstream): once the publish branch IS the default branch (dev), this
          # base override can be dropped (dorny's default would then be correct).
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          # relevant: anything that affects any libc job (gate for the whole matrix).
          # <libc>_image: only the files baked into that libc's image (build vs pull).
          filters: |
            relevant:
              - 'pwndbg/aglib/heap/**'
              - 'pwndbg/libc/**'
              - 'tests/library/dbg/tests/test_heap*'
              - 'tests/library/dbg/tests/test_musl*'
              - 'tests/library/dbg/tests/test_mallocng*'
              - 'tests/library/dbg/tests/test_find_fake_fast*'
              - 'tests/library/dbg/tests/test_vis_heap_chunks*'
              - 'tests/library/dbg/tests/test_bionic*'
              - 'tests/binaries/host/makefile'
              - 'tests/binaries/host/heap_malloc_chunk.native.c'
              - 'tests/binaries/host/heap_bins.native.c'
              - 'tests/binaries/host/heap_musl.native.c'
              - 'tests/binaries/host/bionic_probe.native.c'
              - 'Dockerfile.glibc-test-libs'
              - 'Dockerfile.musl-test-libs'
              - 'Dockerfile.bionic-test-libs'
              - 'scripts/build-one-glibc.sh'
              - 'scripts/build-one-musl.sh'
              - 'scripts/build-one-bionic.sh'
              - '.github/workflows/heap-libc-tests.yml'
            glibc_image:
              - 'Dockerfile.glibc-test-libs'
              - 'scripts/build-one-glibc.sh'
            musl_image:
              - 'Dockerfile.musl-test-libs'
              - 'scripts/build-one-musl.sh'
            bionic_image:
              - 'Dockerfile.bionic-test-libs'
              - 'scripts/build-one-bionic.sh'
              - 'tests/binaries/host/bionic_probe.native.c'

  heap-libc-versions:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: heap-libc-versions (${{ matrix.libc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            image: glibc-test-libs
            dockerfile: Dockerfile.glibc-test-libs
            artifact_dir: glibcs
            sentinel: ld-linux-x86-64.so.2
            build_binaries: true
            test_filter: "test_heap_glibc_versions|test_find_fake_fast|test_vis_heap_chunks"
          - libc: musl
            image: musl-test-libs
            dockerfile: Dockerfile.musl-test-libs
            artifact_dir: musls
            sentinel: lib/libc.a
            build_binaries: true
            test_filter: "test_musl_versions|test_mallocng"
          - libc: bionic
            image: bionic-test-libs
            dockerfile: Dockerfile.bionic-test-libs
            artifact_dir: bionics
            sentinel: bionic_probe.*-static.out
            build_binaries: false
            test_filter: test_bionic_versions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Decide build/pull/publish from dorny's per-libc image-changed flag:
      #   - pull:    image-defining files unchanged -> reuse the prebuilt image
      #   - publish: changed on the publish branch -> build + push
      #   - build:   changed elsewhere (e.g. a PR) -> build locally, no push
      - name: Resolve image and mode
        id: mode
        env:
          GLIBC_IMG: ${{ needs.changes.outputs.glibc_image }}
          MUSL_IMG: ${{ needs.changes.outputs.musl_image }}
          BIONIC_IMG: ${{ needs.changes.outputs.bionic_image }}
        run: |
          set -euo pipefail
          # ghcr repo names must be lowercase; github.repository_owner preserves case.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          case "${{ matrix.libc }}" in
            glibc) image_changed="${GLIBC_IMG}" ;;
            musl) image_changed="${MUSL_IMG}" ;;
            bionic) image_changed="${BIONIC_IMG}" ;;
          esac
          if [ "${image_changed}" != "true" ]; then
            mode=pull
          # TODO(upstream): change refs/heads/libc -> refs/heads/dev before merging.
          elif [ "${{ github.ref }}" = "refs/heads/libc" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            mode=publish
          else
            mode=build
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "image_changed=${image_changed}; selected mode: ${mode}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: steps.mode.outputs.mode == 'publish'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the multi-stage image and load it locally; on publish also write the
      # build-layer cache to the registry.
      - name: Build ${{ matrix.libc }} image
        if: steps.mode.outputs.mode != 'pull'
        run: |
          set -euo pipefail
          cache_to=""
          if [ "${{ steps.mode.outputs.mode }}" = "publish" ]; then
            cache_to="--cache-to type=registry,ref=${IMAGE}:buildcache,mode=max"
          fi
          docker buildx build -f ${{ matrix.dockerfile }} \
            --cache-from type=registry,ref=${IMAGE}:buildcache \
            ${cache_to} \
            -t "${IMAGE}:latest" --load .

      - name: Push ${{ matrix.libc }} image
        if: steps.mode.outputs.mode == 'publish'
        run: docker push "${IMAGE}:latest"

      # Pull the prebuilt image; fall back to a local build if it isn't published
      # yet or the package isn't public.
      - name: Pull ${{ matrix.libc }} image
        if: steps.mode.outputs.mode == 'pull'
        run: |
          set -euo pipefail
          if ! docker pull "${IMAGE}:latest"; then
            echo "::warning::${IMAGE}:latest not found (is the package public?); building locally"
            docker buildx build -f ${{ matrix.dockerfile }} -t "${IMAGE}:latest" --load .
          fi

      # scratch image has no entrypoint, so give `docker create` one so it succeeds.
      - name: Extract ${{ matrix.libc }} artifacts
        run: |
          set -euo pipefail
          CID=$(docker create --entrypoint=/ "${IMAGE}:latest")
          trap 'docker rm -f "${CID}" >/dev/null 2>&1 || true' EXIT
          mkdir -p "tests/binaries/host/${{ matrix.artifact_dir }}"
          docker cp "${CID}:/${{ matrix.artifact_dir }}/." "tests/binaries/host/${{ matrix.artifact_dir }}/"
          ls "tests/binaries/host/${{ matrix.artifact_dir }}/"

      # Cross-check against the versions declared in the Dockerfile, so a stale or
      # partial image fails loudly instead of a whole version silently never running.
      - name: Verify ${{ matrix.libc }} artifacts
        run: |
          set -euo pipefail
          root="tests/binaries/host/${{ matrix.artifact_dir }}"
          versions=$(sed -n 's/^FROM base-builder AS build-\([0-9][0-9.]*\).*/\1/p' "${{ matrix.dockerfile }}")
          [ -n "${versions}" ] || { echo "ERROR: no versions parsed from ${{ matrix.dockerfile }}"; exit 1; }
          for ver in ${versions}; do
            if ! compgen -G "${root}/${ver}/${{ matrix.sentinel }}" >/dev/null; then
              echo "ERROR: missing artifact ${root}/${ver}/${{ matrix.sentinel }}"
              ls -la "${root}/${ver}" 2>/dev/null || true
              exit 1
            fi
          done
          echo "Verified ${{ matrix.libc }} artifacts for: ${versions}"

      - name: Run ${{ matrix.libc }} version tests
        run: |
          docker compose run -T --rm --quiet-pull -v "$(pwd):/pwndbg" ubuntu24.04 bash -c '
            set -euo pipefail
            # glibc/musl compile their per-version test binaries in the container;
            # bionic ships them prebuilt in the image (the NDK clang is not here).
            if [ "${{ matrix.build_binaries }}" = "true" ]; then
              make -C /pwndbg/tests/binaries/host -j4 all
            fi
            echo "Running ${{ matrix.libc }} multi-version tests..."
            ./tests.sh -d gdb -g dbg "${{ matrix.test_filter }}"
          '
