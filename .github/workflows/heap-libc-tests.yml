name: Heap Libc Version Tests

# Tests pwndbg heap commands against multiple glibc versions.
# Builds glibc shared libraries (registry-cached, so only new versions take time)
# and runs heap-specific tests against each version.

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:
  push:
    branches: libc-testing
    paths:
      - 'pwndbg/aglib/heap/**'
      - 'pwndbg/libc/**'
      - 'tests/library/dbg/tests/test_heap*'
      - 'tests/library/dbg/tests/test_vis_heap*'
      - 'tests/library/dbg/tests/test_find_fake*'
      - 'tests/library/dbg/tests/test_try_free*'
      - 'tests/binaries/host/Makefile'
      - 'Dockerfile.glibc-test-libs'
      - 'scripts/build-one-glibc.sh'
      - 'scripts/download-test-glibcs.sh'
  pull_request:
    paths:
      - 'pwndbg/aglib/heap/**'
      - 'pwndbg/libc/**'
      - 'tests/library/dbg/tests/test_heap*'
      - 'tests/library/dbg/tests/test_vis_heap*'
      - 'tests/library/dbg/tests/test_find_fake*'
      - 'tests/library/dbg/tests/test_try_free*'
      - 'tests/binaries/host/Makefile'
      - 'Dockerfile.glibc-test-libs'
      - 'scripts/build-one-glibc.sh'
      - 'scripts/download-test-glibcs.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  heap-glibc-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GLIBC_IMAGE: ghcr.io/monthly-recurring-revenue/glibc-test-libs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build glibc test libraries image. Registry cache means already-built
      # versions are instant (~30s total). Only new versions trigger a real build.
      - name: Build glibc test libraries
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile.glibc-test-libs
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ env.GLIBC_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.GLIBC_IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.GLIBC_IMAGE) || '' }}

      - name: Extract glibc test artifacts
        run: |
          # scratch image has no entrypoint, so we specify a dummy one for docker create
          CID=$(docker create --entrypoint=/ ${{ env.GLIBC_IMAGE }}:latest)
          mkdir -p tests/binaries/host/glibcs
          docker cp "${CID}:/glibcs/." tests/binaries/host/glibcs/
          docker rm "${CID}" > /dev/null
          echo "Extracted glibc artifacts:"
          ls tests/binaries/host/glibcs/

      - name: Run heap version tests
        run: |
          docker compose run -T --rm --quiet-pull -v $(pwd):/pwndbg ubuntu24.04 bash -c '
            set -euo pipefail

            # Build glibc-version-specific test binaries
            make -C /pwndbg/tests/binaries/host -j4 all

            # Run only the glibc version tests
            echo "Running glibc multi-version heap tests..."
            ./tests.sh -d gdb -g dbg test_heap_glibc_versions
          '

      - name: Create issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = 'Heap glibc version tests failing (scheduled run)';
            const body = [
              '## Scheduled heap glibc version tests failed',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This may indicate a regression in heap command support for one or more glibc versions.',
              'Please check the failing tests and fix any issues.',
              '',
              `Commit: ${context.sha}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'heap-libc-test-failure',
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['heap-libc-test-failure'],
              });
            }
