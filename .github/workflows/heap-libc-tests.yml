name: Heap Libc Version Tests

# Tests pwndbg heap commands against multiple glibc versions.
# Pre-built glibc artifacts are cached in GitHub Actions cache (~63MB).
# On cache miss, builds them via Docker multi-stage (parallelized).

on:
  schedule:
    - cron: '0 6 * * 1,4'  # Monday & Thursday 6am UTC (keeps cache alive)
  workflow_dispatch:
  push:
    branches: libc-testing
    paths:
      - 'pwndbg/aglib/heap/**'
      - 'pwndbg/libc/**'
      - 'tests/library/dbg/tests/test_heap*'
      - 'tests/library/dbg/tests/test_vis_heap*'
      - 'tests/library/dbg/tests/test_find_fake*'
      - 'tests/library/dbg/tests/test_try_free*'
      - 'tests/binaries/host/Makefile'
      - 'Dockerfile.glibc-test-libs'
      - 'scripts/build-one-glibc.sh'
  pull_request:
    paths:
      - 'pwndbg/aglib/heap/**'
      - 'pwndbg/libc/**'
      - 'tests/library/dbg/tests/test_heap*'
      - 'tests/library/dbg/tests/test_vis_heap*'
      - 'tests/library/dbg/tests/test_find_fake*'
      - 'tests/library/dbg/tests/test_try_free*'
      - 'tests/binaries/host/Makefile'
      - 'Dockerfile.glibc-test-libs'
      - 'scripts/build-one-glibc.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write

jobs:
  heap-glibc-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Cache glibc artifacts
        id: cache-glibcs
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: tests/binaries/host/glibcs
          key: glibcs-v1-${{ hashFiles('scripts/build-one-glibc.sh', 'Dockerfile.glibc-test-libs') }}

      - name: Build glibc test libraries
        if: steps.cache-glibcs.outputs.cache-hit != 'true'
        run: |
          docker buildx build -f Dockerfile.glibc-test-libs -t glibc-test-libs:local --load .
          CID=$(docker create --entrypoint=/ glibc-test-libs:local)
          mkdir -p tests/binaries/host/glibcs
          docker cp "${CID}:/glibcs/." tests/binaries/host/glibcs/
          docker rm "${CID}" > /dev/null
          echo "Built glibc artifacts:"
          ls tests/binaries/host/glibcs/

      - name: Verify glibc artifacts
        run: |
          echo "Glibc artifacts:"
          ls tests/binaries/host/glibcs/
          for dir in tests/binaries/host/glibcs/*/; do
            ver=$(basename "$dir")
            if [ ! -f "$dir/libc.so.6" ] || [ ! -f "$dir/ld-linux-x86-64.so.2" ]; then
              echo "ERROR: Missing artifacts in $ver"
              ls -la "$dir"
              exit 1
            fi
          done
          echo "All glibc artifacts verified."

      - name: Run heap version tests
        run: |
          docker compose run -T --rm --quiet-pull -v $(pwd):/pwndbg ubuntu24.04 bash -c '
            set -euo pipefail

            # Build glibc-version-specific test binaries
            make -C /pwndbg/tests/binaries/host -j4 all

            # Run only the glibc version tests
            echo "Running glibc multi-version heap tests..."
            ./tests.sh -d gdb -g dbg test_heap_glibc_versions
          '

      - name: Create issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = 'Heap glibc version tests failing (scheduled run)';
            const body = [
              '## Scheduled heap glibc version tests failed',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This may indicate a regression in heap command support for one or more glibc versions.',
              'Please check the failing tests and fix any issues.',
              '',
              `Commit: ${context.sha}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'heap-libc-test-failure',
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['heap-libc-test-failure'],
              });
            }
