name: Standalone Zig Client Reproducer (Fedora vs Ubuntu musl debuginfo)

on:
  push:
    branches:
      - fix-tests

permissions:
  contents: read
  packages: read

jobs:
  # Build pwndbg/debuginfod-zig via `nix build .#static` (same flow as
  # upstream CI and as pypi-for-pwndbg's libdebuginfod-zig.nix). nix is
  # needed because the project pins a purged dev-Zig nightly
  # (0.16.0-dev.1458+755a3d957, dated 2025-11-24); the URL on
  # ziglang.org/builds returns 404 but zig-overlay keeps a cached copy.
  #
  # The built static archive is linked into a tiny C harness that calls
  # debuginfod_find_debuginfo() against a local mock HTTP server serving
  # a controlled file. Two matrix legs, 500 iters each:
  #   - fedora: 2.4 MB Fedora 42 musl debuginfo that crashes in real CI
  #   - ubuntu: 985 KB Ubuntu 22.04 musl debuginfo (control)
  #
  # Decision matrix:
  #   fedora panics + ubuntu clean -> file-shape-dependent Zig parser bug
  #   both panic                   -> file-independent client bug
  #   neither panics               -> standalone lib is clean; GDB drives
  #                                   it into trouble (threading/fork/solib)
  zig_repro:
    name: "zig debuginfod-zig stress (${{ matrix.distro }} musl file)"
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            build_id: "515302d433fe7c803495583f76e663a055dd4fc5"
          - distro: ubuntu
            build_id: "e642b1372f59d5f8a828f027ef1344b7cd17cc94"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pwndbg/debuginfod-zig
          path: debuginfod-zig

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build libdebuginfod.a via nix
        working-directory: debuginfod-zig
        run: |
          set -euo pipefail
          nix build .#static --print-build-logs
          echo ""
          echo "--- result tree ---"
          ls -laR result/ | head -60
          echo "---"

          ARCHIVE=$(find result -name 'libdebuginfod.a' -type f | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "FATAL: libdebuginfod.a not found under result/"
            find result -type f | head -50
            exit 1
          fi
          echo "archive: $ARCHIVE ($(stat -Lc %s "$ARCHIVE") bytes)"
          # result/ is a symlink into /nix/store so use realpath
          REAL=$(realpath "$ARCHIVE")
          echo "ZIG_ARCHIVE=$REAL" >> "$GITHUB_ENV"

      - name: Fetch target musl debuginfo file
        id: fetchfile
        run: |
          set -euo pipefail
          BID='${{ matrix.build_id }}'
          URL="https://debuginfod.pwndbg.re/buildid/${BID}/debuginfo"
          echo "fetching $URL"
          curl -fsSLo /tmp/target.debug "$URL"
          SIZE=$(stat -c %s /tmp/target.debug)
          SHA=$(sha256sum /tmp/target.debug | awk '{print $1}')
          echo "file size=$SIZE sha256=$SHA"

      - name: Write and compile C harness
        run: |
          set -euo pipefail
          cat > /tmp/repro.c <<'EOF'
          /* Call debuginfod_find_debuginfo() once. Mock server serves the
           * same file on every request so the bytes-parsing path runs. */
          #include "debuginfod.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static int hex_nibble(char c) {
              if (c >= '0' && c <= '9') return c - '0';
              if (c >= 'a' && c <= 'f') return 10 + c - 'a';
              if (c >= 'A' && c <= 'F') return 10 + c - 'A';
              return -1;
          }

          int main(int argc, char **argv) {
              if (argc != 2) { fprintf(stderr, "usage: %s <40-hex-buildid>\n", argv[0]); return 2; }
              const char *hex = argv[1];
              if (strlen(hex) != 40) { fprintf(stderr, "build-id must be 40 hex chars\n"); return 2; }

              unsigned char bid[20];
              for (int i = 0; i < 20; ++i) {
                  int hi = hex_nibble(hex[2*i]);
                  int lo = hex_nibble(hex[2*i+1]);
                  if (hi < 0 || lo < 0) { fprintf(stderr, "bad hex\n"); return 2; }
                  bid[i] = (unsigned char)((hi << 4) | lo);
              }

              debuginfod_client *c = debuginfod_begin();
              if (!c) { fprintf(stderr, "debuginfod_begin failed\n"); return 3; }

              char *path = NULL;
              int fd = debuginfod_find_debuginfo(c, bid, sizeof(bid), &path);
              int ec = 0;
              if (fd < 0) {
                  fprintf(stderr, "find_debuginfo: %d\n", fd);
                  ec = 4;
              } else {
                  close(fd);
              }
              if (path) free(path);
              debuginfod_end(c);
              return ec;
          }
          EOF

          UPSTREAM_HDR_DIR="$GITHUB_WORKSPACE/debuginfod-zig/upstream"
          if [ ! -f "$UPSTREAM_HDR_DIR/debuginfod.h" ]; then
            echo "FATAL: debuginfod.h not found at $UPSTREAM_HDR_DIR/"
            ls -la "$UPSTREAM_HDR_DIR" || true
            exit 1
          fi

          # client.zig uses std.http (pure Zig) — no libcurl/openssl needed.
          # libc + pthread + libm + libdl is sufficient.
          cc -O0 -g -I "$UPSTREAM_HDR_DIR" /tmp/repro.c \
              "$ZIG_ARCHIVE" \
              -lpthread -lm -ldl -o /tmp/repro
          file /tmp/repro

      - name: Start mock debuginfod server
        run: |
          set -euo pipefail
          cat > /tmp/serve.py <<'PY'
          import http.server, socketserver, os
          PATH = os.environ["SERVE_FILE"]
          PORT = int(os.environ.get("PORT", "8088"))
          with open(PATH, "rb") as f:
              DATA = f.read()
          print(f"[mock] serving {PATH} ({len(DATA)} bytes) on :{PORT}", flush=True)

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/__health":
                      self.send_response(200); self.send_header("Content-Length", "2")
                      self.end_headers(); self.wfile.write(b"ok"); return
                  if "/buildid/" in self.path and self.path.endswith("/debuginfo"):
                      self.send_response(200)
                      self.send_header("Content-Type", "application/octet-stream")
                      self.send_header("Content-Length", str(len(DATA)))
                      self.end_headers()
                      self.wfile.write(DATA); return
                  self.send_response(404); self.end_headers()
              def log_message(self, *a, **kw): pass

          class TS(socketserver.ThreadingMixIn, http.server.HTTPServer):
              daemon_threads = True
              allow_reuse_address = True

          with TS(("127.0.0.1", PORT), H) as s:
              s.serve_forever()
          PY
          SERVE_FILE=/tmp/target.debug PORT=8088 python3 /tmp/serve.py &
          echo $! > /tmp/server.pid

          # Readiness: poll /__health (returns 200) with -fsS. Without the
          # dedicated endpoint curl -f would fail on the 404 we previously
          # used, making the "ready" check a silent no-op.
          UP=0
          for i in $(seq 1 50); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8088/__health"; then
              echo "server up (try $i)"; UP=1; break
            fi
            sleep 0.2
          done
          if [ "$UP" != "1" ]; then
            echo "FATAL: mock server did not come up"
            exit 1
          fi

      - name: Stress-loop the Zig client (500 iterations)
        env:
          BID: "${{ matrix.build_id }}"
          DISTRO: "${{ matrix.distro }}"
        run: |
          set -uo pipefail
          export DEBUGINFOD_URLS="http://127.0.0.1:8088"
          export DEBUGINFOD_CACHE_PATH=/tmp/zig_cache
          export DEBUGINFOD_TIMEOUT=10
          ITERS=500
          PANIC=0
          NONZERO=0
          OK=0
          TIMEOUT=0

          mkdir -p /tmp/logs
          for i in $(seq 1 $ITERS); do
            # Fresh cache each iteration so the client actually fetches
            # the bytes through the network/parse path every time.
            rm -rf "$DEBUGINFOD_CACHE_PATH"
            mkdir -p "$DEBUGINFOD_CACHE_PATH"

            # timeout(1) prevents one stuck iteration from hanging the job.
            # 15s per call is generous; the mock is local.
            timeout --signal=KILL 15 /tmp/repro "$BID" \
                > "/tmp/logs/run_$i.out" 2> "/tmp/logs/run_$i.err"
            ec=$?

            # Panic detection:
            #  - grep stderr for "panic:" (zig debug-mode runtime panics)
            #  - fall back to exit codes 134 (SIGABRT) and 139 (SIGSEGV)
            #    in case stderr got truncated before flush
            if grep -q "panic:" "/tmp/logs/run_$i.err"; then
              PANIC=$((PANIC+1))
              echo "--- run $i PANIC (ec=$ec) ---"
              head -20 "/tmp/logs/run_$i.err"
              echo "---"
            elif [ $ec -eq 134 ] || [ $ec -eq 139 ]; then
              PANIC=$((PANIC+1))
              echo "--- run $i SIGABRT/SEGV (ec=$ec, stderr empty/lost) ---"
            elif [ $ec -eq 137 ] || [ $ec -eq 124 ]; then
              TIMEOUT=$((TIMEOUT+1))
            elif [ $ec -ne 0 ]; then
              NONZERO=$((NONZERO+1))
            else
              OK=$((OK+1))
            fi
          done

          echo ""
          echo "========= SUMMARY ($DISTRO) ========="
          echo "iterations:       $ITERS"
          echo "ok:               $OK"
          echo "panic:            $PANIC"
          echo "timeout:          $TIMEOUT"
          echo "nonzero_no_panic: $NONZERO"
          echo "======================================"

      - name: Stop mock server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi
