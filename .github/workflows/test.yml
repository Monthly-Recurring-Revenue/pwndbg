name: Standalone Zig Client Reproducer (Fedora vs Ubuntu musl debuginfo)

on:
  push:
    branches:
      - fix-tests

permissions:
  contents: read
  packages: read

jobs:
  # Build pwndbg/debuginfod-zig from source, link it into a tiny C harness
  # that calls debuginfod_find_debuginfo(), point the client at a local
  # mock HTTP server that serves a controlled file, and run the harness
  # in a tight loop.
  #
  # Two matrix legs feed the SAME client two different files:
  #   - fedora: the 2.4 MB Fedora 42 musl debuginfo that crashes in CI
  #   - ubuntu: the 985 KB Ubuntu 22.04 musl debuginfo (control)
  #
  # If the Zig parser bug is file-size / file-shape dependent, the Fedora
  # leg should panic a measurable fraction of the time and the Ubuntu leg
  # should be clean. If BOTH panic -> bug is not file-specific. If NEITHER
  # panics -> the standalone library isn't the source; the issue is the
  # way GDB drives it (threading, fork, solib handler).
  #
  # 500 iterations per leg; we said anything under 100 is noise.
  zig_repro:
    name: "zig debuginfod-zig stress (${{ matrix.distro }} musl file)"
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            # Fedora 42 musl-libc-1.2.5-3.fc42.x86_64 debuginfo build-id.
            # This is the file whose bytes we feed to the client 500x.
            build_id: "515302d433fe7c803495583f76e663a055dd4fc5"
          - distro: ubuntu
            # Ubuntu 22.04 musl 1.2.2-4 debuginfo build-id.
            build_id: "e642b1372f59d5f8a828f027ef1344b7cd17cc94"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pwndbg/debuginfod-zig
          path: debuginfod-zig

      - name: Install Zig (pinned)
        # debuginfod-zig/build.zig.zon requires minimum_zig_version 0.16.0.
        # The download URL format is zig-<arch>-<os>-<ver>.tar.xz (NOT
        # zig-<os>-<arch>-<ver>, which was pre-0.14 and 404s today).
        run: |
          ZIG_VERSION=0.16.0
          curl -fsSLo /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sudo mkdir -p /opt/zig
          sudo tar -C /opt/zig --strip-components=1 -xf /tmp/zig.tar.xz
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version

      - name: Build libdebuginfod (Zig)
        working-directory: debuginfod-zig
        run: |
          zig build -Doptimize=Debug -Dlinkage=static --verbose 2>&1 | tail -40
          echo ""
          echo "--- install tree ---"
          ls -la zig-out/lib/ zig-out/include/elfutils/ 2>/dev/null || true

      - name: Fetch target musl debuginfo file
        id: fetchfile
        run: |
          BID='${{ matrix.build_id }}'
          URL="https://debuginfod.pwndbg.re/buildid/${BID}/debuginfo"
          echo "fetching $URL"
          curl -fsSLo /tmp/target.debug "$URL"
          SIZE=$(stat -c %s /tmp/target.debug)
          SHA=$(sha256sum /tmp/target.debug | awk '{print $1}')
          echo "file size=$SIZE sha256=$SHA"
          echo "file_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "file_sha=$SHA"  >> "$GITHUB_OUTPUT"

      - name: Write C harness
        run: |
          cat > /tmp/repro.c <<'EOF'
          /* Tiny harness: ask the Zig-built libdebuginfod for a debuginfo file
           * by build-id. Server is mocked locally so we control the bytes. */
          #include <elfutils/debuginfod.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static int hex_nibble(char c) {
              if (c >= '0' && c <= '9') return c - '0';
              if (c >= 'a' && c <= 'f') return 10 + c - 'a';
              if (c >= 'A' && c <= 'F') return 10 + c - 'A';
              return -1;
          }

          int main(int argc, char **argv) {
              if (argc != 2) { fprintf(stderr, "usage: %s <40-hex-buildid>\n", argv[0]); return 2; }
              const char *hex = argv[1];
              if (strlen(hex) != 40) { fprintf(stderr, "build-id must be 40 hex chars\n"); return 2; }

              unsigned char bid[20];
              for (int i = 0; i < 20; ++i) {
                  int hi = hex_nibble(hex[2*i]);
                  int lo = hex_nibble(hex[2*i+1]);
                  if (hi < 0 || lo < 0) { fprintf(stderr, "bad hex\n"); return 2; }
                  bid[i] = (unsigned char)((hi << 4) | lo);
              }

              debuginfod_client *c = debuginfod_begin();
              if (!c) { fprintf(stderr, "debuginfod_begin failed\n"); return 3; }

              char *path = NULL;
              int fd = debuginfod_find_debuginfo(c, bid, sizeof(bid), &path);
              int ec = 0;
              if (fd < 0) {
                  fprintf(stderr, "find_debuginfo: %d\n", fd);
                  ec = 4;
              } else {
                  close(fd);
              }
              if (path) free(path);
              debuginfod_end(c);
              return ec;
          }
          EOF

          # Compile against the Zig-built static archive.
          ZIG_OUT="$GITHUB_WORKSPACE/debuginfod-zig/zig-out"
          cc -O0 -g -I "$ZIG_OUT/include" /tmp/repro.c \
              "$ZIG_OUT/lib/libdebuginfod.a" \
              -lpthread -lm -ldl -o /tmp/repro
          file /tmp/repro
          ldd /tmp/repro || true

      - name: Start mock debuginfod server
        run: |
          # Minimal HTTP server that serves the same file bytes on every
          # /buildid/*/debuginfo request. No 202, no chunked games, no
          # retries -- just vanilla content-length + body.
          cat > /tmp/serve.py <<'PY'
          import http.server, socketserver, sys, os, threading, time
          PATH = os.environ["SERVE_FILE"]
          PORT = int(os.environ.get("PORT", "8088"))
          with open(PATH, "rb") as f:
              DATA = f.read()
          print(f"[mock] serving {PATH} ({len(DATA)} bytes) on :{PORT}", flush=True)

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if "/buildid/" in self.path and self.path.endswith("/debuginfo"):
                      self.send_response(200)
                      self.send_header("Content-Type", "application/octet-stream")
                      self.send_header("Content-Length", str(len(DATA)))
                      self.end_headers()
                      self.wfile.write(DATA)
                  else:
                      self.send_response(404); self.end_headers()
              def log_message(self, *a, **kw):
                  pass

          class TS(socketserver.ThreadingMixIn, http.server.HTTPServer):
              daemon_threads = True
              allow_reuse_address = True

          with TS(("127.0.0.1", PORT), H) as s:
              s.serve_forever()
          PY
          SERVE_FILE=/tmp/target.debug PORT=8088 python3 /tmp/serve.py &
          echo $! > /tmp/server.pid
          # Wait for listener
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8088/buildid/deadbeef/debuginfo"; then
              echo "server up (try $i)"; break
            fi
            sleep 0.2
          done

      - name: Stress-loop the Zig client (500 iterations)
        env:
          BID: "${{ matrix.build_id }}"
        run: |
          export DEBUGINFOD_URLS="http://127.0.0.1:8088"
          export DEBUGINFOD_CACHE_PATH=/tmp/zig_cache
          export DEBUGINFOD_TIMEOUT=10
          ITERS=500
          PANIC=0
          NONZERO=0
          OK=0

          mkdir -p /tmp/logs
          for i in $(seq 1 $ITERS); do
            # Fresh cache each iteration so every run actually downloads the
            # file through the client's network path. That's what triggers
            # the parser in GDB, so we want the same shape here.
            rm -rf "$DEBUGINFOD_CACHE_PATH"
            mkdir -p "$DEBUGINFOD_CACHE_PATH"

            /tmp/repro "$BID" > "/tmp/logs/run_$i.out" 2> "/tmp/logs/run_$i.err"
            ec=$?

            if grep -q "panic:" "/tmp/logs/run_$i.err"; then
              PANIC=$((PANIC+1))
              echo "--- run $i PANIC (ec=$ec) ---"
              head -20 "/tmp/logs/run_$i.err"
              echo "---"
            elif [ $ec -ne 0 ]; then
              NONZERO=$((NONZERO+1))
            else
              OK=$((OK+1))
            fi
          done

          echo ""
          echo "========= SUMMARY (${{ matrix.distro }}) ========="
          echo "iterations: $ITERS"
          echo "ok:         $OK"
          echo "panic:      $PANIC"
          echo "nonzero_no_panic: $NONZERO"
          echo "=================================================="

      - name: Stop mock server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi
