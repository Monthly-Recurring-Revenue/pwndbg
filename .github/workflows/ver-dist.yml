name: Check musl debuginfo presence across all test distros

on:
  push:
    branches:
      - fix-tests

permissions:
  contents: read
  packages: read

jobs:
  # One pass per distro image we test on. For each:
  #   1. Is musl-gcc installed? (gates whether mallocng tests even run)
  #   2. What musl .so is loaded at runtime, and what's its build-id?
  #   3. Is the matching debuginfo file already under /usr/lib/debug/.build-id?
  #   4. How fast does debuginfod-find return? local-hit = <50ms, remote = seconds.
  #   5. Run mallocng once and report PASS/FAIL (single-run signal, not statistics).
  #
  # Theory to verify: distros where musl debuginfo is pre-installed or trivially
  # local never hit the Zig client path and never panic. Only distros that fall
  # through to debuginfod.pwndbg.re get bitten. If Fedora is the ONLY distro
  # without local musl debuginfo, that exactly explains the observed distribution.
  probe_musl_dbg:
    name: "musl debuginfo probe (${{ matrix.image }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ubuntu22.04, dockerfile: Dockerfile,     base: "ubuntu:22.04" }
          - { image: ubuntu24.04, dockerfile: Dockerfile,     base: "ubuntu:24.04" }
          - { image: debian12,    dockerfile: Dockerfile,     base: "debian:12" }
          - { image: archlinux,   dockerfile: Dockerfile.arch, base: "archlinux:latest" }
          - { image: fedora41,    dockerfile: Dockerfile.dnf, base: "fedora:41" }
          - { image: fedora42,    dockerfile: Dockerfile.dnf, base: "fedora:42" }
          - { image: fedora43,    dockerfile: Dockerfile.dnf, base: "fedora:43" }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pwndbg/pwndbg
          ref: 1641c8cb3b614be7035d41abe3d60542933e4a3e
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker buildx build --load \
            --cache-from type=registry,ref=ghcr.io/pwndbg/cache:${{ matrix.image }}-amd64 \
            -f ${{ matrix.dockerfile }} \
            --build-arg image=${{ matrix.base }} \
            -t ghcr.io/pwndbg/pwndbg:${{ matrix.image }} .
      - name: Probe musl debuginfo and run mallocng
        run: |
          docker compose run -T --rm --pull never -v $(pwd):/pwndbg ${{ matrix.image }} bash -c '
            set -uo pipefail

            echo "=============================================================="
            echo "[PROBE ${{ matrix.image }}] Installed debuginfo-related packages"
            echo "=============================================================="
            if command -v dpkg >/dev/null 2>&1; then
              dpkg -l 2>/dev/null | grep -iE "musl|dbg|debug" | head -30 || echo "(none)"
            elif command -v rpm >/dev/null 2>&1; then
              rpm -qa 2>/dev/null | grep -iE "musl|debuginfo|debugsource" | sort | head -30 || echo "(none)"
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Qs 2>/dev/null | grep -iE "musl|debug" | head -30 || echo "(none)"
            fi

            echo ""
            echo "=== musl-gcc presence ==="
            if command -v musl-gcc >/dev/null 2>&1; then
              echo "musl-gcc: $(command -v musl-gcc)"
              musl-gcc --version 2>&1 | head -1 || true
            else
              echo "musl-gcc: NOT INSTALLED -> mallocng tests will be SKIPPED on this distro"
              echo "[PROBE ${{ matrix.image }}] === NO MUSL TOOLCHAIN ==="
              exit 0
            fi

            echo ""
            echo "=== musl .so seen by ldconfig ==="
            ldconfig -p 2>/dev/null | grep -iE "musl" || echo "(not cached)"

            # Build the test binary so we can see which musl the dynamic linker
            # actually picks up at runtime, not just what ldconfig knows.
            echo ""
            echo "=== Build test binaries ==="
            make -C /pwndbg/tests/binaries/host -j4 heap_musl_dyn.native.out 2>&1 | tail -5

            MUSL_BIN=/pwndbg/tests/binaries/host/heap_musl_dyn.native.out
            if [ ! -f "$MUSL_BIN" ]; then
              echo "[PROBE ${{ matrix.image }}] FAIL: could not build $MUSL_BIN"
              exit 1
            fi

            # Find the dynamic musl loader referenced by the binary and its build-id.
            MUSL_SO=$(readelf -a "$MUSL_BIN" 2>/dev/null | awk "/Requesting program interpreter/ {print \$NF}" | tr -d "]")
            if [ -z "$MUSL_SO" ]; then
              # Fallback via ldd
              MUSL_SO=$(ldd "$MUSL_BIN" 2>/dev/null | awk "/musl/ {print \$NF; exit}")
            fi
            echo "=== Runtime musl loader: $MUSL_SO ==="
            if [ -z "$MUSL_SO" ] || [ ! -f "$MUSL_SO" ]; then
              echo "[PROBE ${{ matrix.image }}] FAIL: musl loader not found at runtime"
              exit 1
            fi

            BID=""
            for tool in eu-readelf readelf; do
              if command -v $tool >/dev/null 2>&1; then
                BID=$($tool -n "$MUSL_SO" 2>/dev/null | grep -Eo "[0-9a-f]{40}" | head -1)
                [ -n "$BID" ] && break
              fi
            done
            echo "=== musl build-id: ${BID:-UNKNOWN} ==="

            echo ""
            echo "=== Local debug file search ==="
            if [ -n "$BID" ]; then
              P="/usr/lib/debug/.build-id/${BID:0:2}/${BID:2}.debug"
              if [ -f "$P" ]; then
                echo "LOCAL DEBUGINFO PRESENT: $P ($(stat -c %s "$P") bytes)"
                echo "[PROBE ${{ matrix.image }}] MUSL_DEBUG_LOCAL=yes"
              else
                echo "LOCAL DEBUGINFO MISSING: no file at $P"
                echo "[PROBE ${{ matrix.image }}] MUSL_DEBUG_LOCAL=no"
              fi
            fi
            find /usr/lib/debug -name "*musl*" 2>/dev/null | head -5 || true

            echo ""
            echo "=== debuginfod-find timing (local hit = fast, remote = slow) ==="
            if command -v debuginfod-find >/dev/null 2>&1; then
              # Make sure we actually have URLs configured (Fedora has them in /etc/debuginfod)
              if [ -z "${DEBUGINFOD_URLS:-}" ]; then
                DEBUGINFOD_URLS=$(cat /etc/debuginfod/*.urls 2>/dev/null | tr "\n" " " || echo "")
                export DEBUGINFOD_URLS
              fi
              echo "DEBUGINFOD_URLS=$DEBUGINFOD_URLS"
              # Use fresh cache so timing reflects first-hit cost
              export DEBUGINFOD_CACHE_PATH=/tmp/probe_cache_$$
              mkdir -p "$DEBUGINFOD_CACHE_PATH"
              { time debuginfod-find debuginfo "$MUSL_SO" >/tmp/dbginfo_path 2>/tmp/dbginfo_err ; } 2>/tmp/dbginfo_time
              ec=$?
              echo "exit=$ec"
              echo "stdout: $(cat /tmp/dbginfo_path 2>/dev/null)"
              sed "s/^/stderr: /" /tmp/dbginfo_err 2>/dev/null | head -10
              sed "s/^/time:   /" /tmp/dbginfo_time
            else
              echo "debuginfod-find: NOT INSTALLED"
            fi

            echo ""
            echo "=== Single-shot mallocng run ==="
            make -C /pwndbg/tests/binaries/host -j4 all 2>&1 | tail -3
            gdb --batch
            set +e
            ./tests.sh -d gdb -g dbg mallocng > /tmp/out.log 2>&1 & wait $!; ec=$?
            set -e
            tail -30 /tmp/out.log | sed "s/^/[PROBE ${{ matrix.image }}] /"

            if [ $ec -eq 0 ]; then
              echo "[PROBE ${{ matrix.image }}] === TEST RESULT: PASS ==="
            else
              echo "[PROBE ${{ matrix.image }}] === TEST RESULT: FAIL ==="
              grep -E "integer overflow|panic|Fatal" /tmp/out.log | sed "s/^/[PROBE ${{ matrix.image }}] /" || true
            fi
          '
